# ─────────────────────────────────────────────────────────────────────────────
# Security headers for thallodigital.com (the static site at the domain root)
#
# WHY THIS IS A SNIPPET AND NOT A FILE THE DEPLOY SHIPS
# ----------------------------------------------------
# `.github/workflows/deploy-bluehost.yml` excludes `**/.htaccess` from the FTP
# upload on purpose: the document root's .htaccess is not ours alone — it is
# also what routes /blog/ to WordPress — and a deploy that overwrites it can
# take the blog down with it. So this block is pasted in by hand, once, and the
# deploy keeps its hands off it.
#
# securityheaders.com graded the root F on 4 September 2026 with all six of
# these missing. Each one below says what it stops.
#
# WHERE IT GOES
# -------------
# Bluehost → File Manager → the site's document root (the folder named in the
# BLUEHOST_SERVER_DIR secret, NOT /public_html/ — that belongs to another site
# on this account) → .htaccess. Paste this ABOVE any WordPress block. Apache
# inherits headers into subdirectories, so read the /blog/ note at the bottom
# before you paste the CSP line.
#
# HOW TO ROLL IT OUT
# ------------------
# 1. Paste everything except the Content-Security-Policy line. Those five are
#    safe immediately — nothing on this site can break on them.
# 2. Paste the Content-Security-Policy-Report-Only line instead of the real one.
#    Browse the site, open DevTools → Console, and see what it would have
#    blocked. Give it a few days of real traffic.
# 3. When the console is quiet, rename it to Content-Security-Policy.
# ─────────────────────────────────────────────────────────────────────────────

<IfModule mod_headers.c>

  # HTTPS only, for a year, remembered by the browser. Stops the downgrade
  # attack: someone on the same wifi forcing a visitor's first request to HTTP
  # and reading it. `includeSubDomains` covers everything under the domain —
  # check that every subdomain you use has a valid certificate before you keep
  # it. `preload` is deliberately absent: it is a one-way door.
  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

  # Nobody may put this site in an iframe. Kills clickjacking — an invisible
  # copy of the contact form layered under a decoy page.
  Header always set X-Frame-Options "SAMEORIGIN"

  # The browser trusts the Content-Type we declare and stops guessing. Without
  # it an uploaded file can be sniffed into being executed as something else.
  Header always set X-Content-Type-Options "nosniff"

  # Other sites get the domain a visitor came from, never the full URL and its
  # query string.
  Header always set Referrer-Policy "strict-origin-when-cross-origin"

  # Camera, microphone and location are switched off for this page and for
  # anything it embeds, so no third-party script can ask for them.
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

  # ── Content-Security-Policy ────────────────────────────────────────────────
  # The one that actually stops XSS: an injected script has to come from a
  # source named here, and an attacker's does not.
  #
  # Two 'unsafe-inline' are not laziness, they are what this stack requires:
  #  · script-src — Next's static export ships its hydration payload as inline
  #    <script> tags (self.__next_f.push). A static export cannot mint a nonce
  #    per request, so there is no stricter option short of leaving Next.
  #  · style-src  — GSAP writes inline styles on every animated element, and
  #    components inject their own <style> blocks.
  #
  # The rest is tight: no plugins, no framing us, forms can only post to our own
  # origin, and the only third party allowed is Google Analytics.
  #
  # ── STEP 2: paste this first, watch the console, THEN switch the name ──
  # Header always set Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com; font-src 'self' data:; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; upgrade-insecure-requests"
  #
  # ── STEP 3: the real thing ──
  Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com; font-src 'self' data:; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; upgrade-insecure-requests"

</IfModule>

# ─────────────────────────────────────────────────────────────────────────────
# THE BLOG
#
# Apache inherits these headers into /blog/, and wp-admin will not survive this
# CSP: the editor loads scripts and frames the theme preview in ways the policy
# above forbids. The other five headers are fine there and worth keeping.
#
# So put this in /blog/.htaccess, INSIDE the WordPress block's own file but
# above the "# BEGIN WordPress" marker (WordPress rewrites everything between
# the BEGIN and END markers and would eat it):
#
#   <IfModule mod_headers.c>
#     Header unset Content-Security-Policy
#     Header unset Content-Security-Policy-Report-Only
#   </IfModule>
#
# If the blog should have a policy of its own, write it there rather than
# loosening the one above — the static site and WordPress load different things
# and one policy that satisfies both is barely a policy.
# ─────────────────────────────────────────────────────────────────────────────
