# NOT FIXABLE HERE — ask Bluehost support
#
# Bluehost's ModSecurity rules answer some crawlers with "406 Not Acceptable"
# before any of this file is read. Measured on 6 October 2026:
#
#   CCBot/2.0 (Common Crawl)   → 406     GPTBot, ClaudeBot, PerplexityBot → 200
#   python-requests/2.x        → 406     OAI-SearchBot, Googlebot, bingbot → 200
#
# Common Crawl is the open corpus a large share of models are trained on, and
# our own scan names CCBot as one of the crawlers that must not be blocked.
# python-requests is the default user agent of many AI agents and tools.
# Ask support to whitelist those user agents in ModSecurity for this domain
# (cPanel → Security → ModSecurity can only switch it off for the whole
# domain, which is the wrong trade).
