# ─────────────────────────────────────────────────────────────────────────────
# Serving the agent files — llms.txt, llms-full.txt and every page's index.md
#
# `scripts/agent-files.mjs` writes them into the build on every deploy. These
# lines make Apache serve them properly. Pasted by hand into the document
# root's .htaccess, for the same reason the security headers are: the deploy
# never uploads an .htaccess (read deploy/htaccess-security-headers.conf).
#
# WHERE: Bluehost → File Manager → the site's document root (the folder named in
# the BLUEHOST_SERVER_DIR secret) → .htaccess. ABOVE the WordPress block.
#
# The files work without any of this. What each block adds is said above it.
# ─────────────────────────────────────────────────────────────────────────────

# 1 · Say the files are UTF-8, and that .md is Markdown.
#
# Today Apache sends .txt as `text/plain` with no charset, and a client left to
# guess — Python's `requests`, which half the agent tooling is built on —
# guesses Latin-1. The script folds punctuation to ASCII so nothing breaks in
# the meantime; this is the real fix. `.md` has no type at all by default.
AddCharset UTF-8 .txt .md .xml
AddType text/markdown .md

# 2 · Keep the Markdown copies out of Google's index.
#
# They are the same pages as the HTML, in a second format. Agents fetch them
# from llms.txt and from the <link rel="alternate"> on every page; nothing is
# gained by Google ranking /services/index.md against /services/. `follow`
# keeps the links in them counting.
<IfModule mod_headers.c>
  <FilesMatch "\.md$|^llms-full\.txt$">
    Header set X-Robots-Tag "noindex, follow"
  </FilesMatch>
</IfModule>

# 3 · Optional: answer `Accept: text/markdown` with the Markdown.
#
# Some agents (Claude Code's fetch among them) ask for Markdown in the Accept
# header. With this, https://thallodigital.com/services/ returns index.md to
# them and the HTML to everybody else. /blog/ is excluded — it is WordPress and
# has no index.md. `Vary: Accept` stops a cache handing one to the other.
<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteCond %{HTTP_ACCEPT} text/markdown [NC]
  RewriteCond %{REQUEST_URI} !^/blog/
  RewriteCond %{REQUEST_URI} /$
  RewriteCond %{REQUEST_FILENAME}index.md -f
  RewriteRule ^(.*)$ $1index.md [L]
</IfModule>
<IfModule mod_headers.c>
  <FilesMatch "\.html$">
    Header append Vary Accept
  </FilesMatch>
</IfModule>

