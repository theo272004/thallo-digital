name: Deploy Next.js site to Bluehost

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=dev

      - name: Build for Bluehost
        run: npm run build
        env:
          DEPLOY_TARGET: bluehost
          # The scan API root, e.g. https://thallodigital.com/blog/wp-json/thallo/v1
          # This is a static export, so it is baked in at build time. Left unset,
          # the tool runs on sample data behind a "preview mode" banner.
          NEXT_PUBLIC_SCAN_API: ${{ secrets.SCAN_API_URL }}
          # Search Console's HTML-tag token. Unset, the meta tag is simply not
          # emitted — a missing value must not fail the build, because DNS TXT
          # verification is the alternative and needs nothing here.
          NEXT_PUBLIC_GSC_VERIFICATION: ${{ secrets.GSC_VERIFICATION }}
          # Cloudflare Web Analytics. Only the Bluehost build gets this: the
          # Pages mirror must never report itself as traffic for this domain.
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN }}

      # Fails the run before a single byte is uploaded if the destination has
      # not been set. The default that used to sit in `server-dir` was
      # /public_html/, which on this account belongs to a DIFFERENT website —
      # a deploy would have published Thallo over another client's site. A
      # missing secret must stop the run, not fall back to a plausible guess.
      - name: Check the destination is configured
        run: |
          if [ -z "${{ secrets.BLUEHOST_SERVER_DIR }}" ]; then
            echo "::error::BLUEHOST_SERVER_DIR is not set."
            echo "Set it in Settings → Secrets and variables → Actions."
            echo "It is the Document Root from Bluehost → Websites → Files & Access,"
            echo "written from the FTP account's home, e.g. /public_html/website_4e8ab97a/"
            exit 1
          fi

      - name: Deploy to Bluehost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BLUEHOST_FTP_SERVER }}
          username: ${{ secrets.BLUEHOST_FTP_USERNAME }}
          password: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ secrets.BLUEHOST_SERVER_DIR }}
          # WordPress lives in a subfolder of this same document root and is
          # never part of the build output. Excluded so that no deploy can
          # touch the blog, whatever else changes here.
          exclude: |
            **/blog/**
            **/.well-known/**
            **/cgi-bin/**
            **/.htaccess
