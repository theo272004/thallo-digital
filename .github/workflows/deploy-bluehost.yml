name: Deploy Next.js site to Bluehost

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=dev

      - name: Build for Bluehost
        run: npm run build
        env:
          DEPLOY_TARGET: bluehost
          # The scan API root, e.g. https://thallodigital.com/blog/wp-json/thallo/v1
          # This is a static export, so it is baked in at build time. Left unset,
          # the tool runs on sample data behind a "preview mode" banner.
          NEXT_PUBLIC_SCAN_API: ${{ secrets.SCAN_API_URL }}

      - name: Deploy to Bluehost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BLUEHOST_FTP_SERVER }}
          username: ${{ secrets.BLUEHOST_FTP_USERNAME }}
          password: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /public_html/
          exclude: |
            **/blog/**
            **/.well-known/**
