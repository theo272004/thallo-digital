<!-- The site's navbar, rebuilt here.

     Written as plain HTML rather than as blocks on purpose. The navbar on the
     rest of the site is a floating pill — fixed, inset from both edges,
     rounded, translucent with a blur behind it — and block layout has no
     vocabulary for that. Forcing it out of groups and rows produced something
     that was nearly it, and nearly it is what makes a reader feel they have
     left the site.

     It is a copy, and copies drift. The trade was accepted knowingly: the
     alternative was serving this page from the Next.js build, which cannot
     have this URL without the deploy being allowed to write into the folder
     WordPress lives in — and that exclusion is the only thing standing between
     a bad deploy and a deleted blog. A navbar in two files is the cheaper
     risk. When the real one changes, this file changes with it. -->
<!-- wp:html -->

      <a class="thallo-btn thallo-btn--solid" href="https://thallodigital.com/contact/">Book an audit <span aria-hidden="true">↗</span></a>

</nav>
<!-- /wp:html -->
